<!DOCTYPE html><html class="dark" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>知行AI语音导航 - 会话历史</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=notoSans:wght@100..900&amp;display=swap" rel="stylesheet">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#beadff",
                        "surface-bright": "#353943",
                        "on-secondary-fixed-variant": "#4c20bd",
                        "surface-container-high": "#262a33",
                        "on-primary-fixed": "#001a43",
                        "primary": "#aec6ff",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-lowest": "#0a0e17",
                        "on-primary": "#002e6b",
                        "on-secondary": "#340098",
                        "on-surface": "#dfe2ef",
                        "tertiary": "#29e0ab",
                        "on-tertiary-fixed": "#002116",
                        "surface-tint": "#aec6ff",
                        "outline-variant": "#424752",
                        "on-primary-fixed-variant": "#004397",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#00a47b",
                        "on-tertiary-container": "#003122",
                        "inverse-on-surface": "#2c303a",
                        "outline": "#8d909e",
                        "error-container": "#93000a",
                        "inverse-surface": "#dfe2ef",
                        "surface": "#0f131c",
                        "surface-dim": "#0f131c",
                        "surface-container-highest": "#31353e",
                        "secondary-container": "#4e24c0",
                        "secondary": "#ccbeff",
                        "inverse-primary": "#1e5bba",
                        "tertiary-fixed": "#55fdc6",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c3c6d4",
                        "primary-container": "#5d8ef1",
                        "on-tertiary": "#003828",
                        "on-secondary-fixed": "#1e0060",
                        "on-error": "#690005",
                        "on-primary-container": "#00275e",
                        "tertiary-fixed-dim": "#29e0ab",
                        "on-background": "#dfe2ef",
                        "background": "#0f131c",
                        "secondary-fixed-dim": "#ccbeff",
                        "secondary-fixed": "#e7deff",
                        "surface-variant": "#31353e",
                        "primary-fixed-dim": "#aec6ff",
                        "surface-container-low": "#181c24",
                        "on-tertiary-fixed-variant": "#00513b",
                        "surface-container": "#1c2029"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "base": "4px",
                        "sm": "12px",
                        "gutter": "16px",
                        "md": "16px",
                        "xs": "8px",
                        "xl": "32px",
                        "margin": "20px"
                    },
                    "fontFamily": {
                        "body-main": ["notoSans"],
                        "label-bold": ["notoSans"],
                        "page-title": ["notoSans"],
                        "caption": ["notoSans"]
                    },
                    "fontSize": {
                        "body-main": ["21px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "label-bold": ["16px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "page-title": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "caption": ["17px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0F1115;
            color: #E8EAF0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar {
            display: none;
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 34px);
        }

        /* 毛玻璃效果辅助类 */
        .glass-card {
            background: rgba(26, 30, 39, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* 会话列表动画相关 */
        .swipe-item-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .swipe-content {
            position: relative;
            z-index: 10;
            background-color: #1A1E27;
            border-radius: 16px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            box-sizing: border-box;
        }

        .swipe-actions {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            z-index: 1;
            padding-right: 0;
            width: 80px; /* 控制露出区域宽度 */
        }
        
        .swipe-content.swiped {
             transform: translateX(-70px);
        }
    </style>
</head>
<body class="antialiased">
<!-- 1. 状态栏占位 (模拟微信小程序顶部) -->
<div class="h-[44px] w-full bg-[#0F1115] shrink-0 z-50"></div>
<!-- 2. 自定义导航栏 (TopAppBar) -->
<!-- Content mapping based on prompt and Brand Anchors JSON override -->
<header class="fixed top-[44px] w-full z-50 flex items-center justify-between px-gutter h-[44px] bg-[#0F1115]">
<!-- 左侧返回 -->
<button class="w-[40px] h-[40px] flex items-center justify-start text-[#E8EAF0] active:opacity-50 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
</button>
<!-- 中心标题 -->
<h1 class="text-[18px] font-medium text-[#E8EAF0] absolute left-1/2 transform -translate-x-1/2 whitespace-nowrap">
            会话历史
        </h1>
<!-- 右侧新建按钮 -->
<button class="w-[40px] h-[40px] rounded-full bg-[#5B8DEF] flex items-center justify-center text-white shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 24px; font-weight: 600;">add</span>
</button>
</header>
<!-- 主内容区 -->
<main class="flex-1 overflow-y-auto pt-[88px] pb-[100px] px-gutter space-y-[12px]">
<!-- 会话 1：常规状态 -->
<div class="w-full bg-[#1A1E27] rounded-2xl p-md active:scale-[0.98] transition-transform cursor-pointer">
<div class="flex flex-col gap-1">
<p class="text-[16px] text-[#E8EAF0] font-medium truncate">今天北京天气怎么样？</p>
<span class="text-[12px] text-[#8A8F9C]">今天 14:32</span>
</div>
</div>
<!-- 会话 2：左滑状态 (Swiped) -->
<div class="swipe-item-container h-[72px]">
<!-- 底层操作按钮 -->
<div class="swipe-actions">
<button class="h-full w-[64px] bg-[#FF5252] flex items-center justify-center rounded-r-2xl text-white text-[14px] font-medium">
                     删除
                 </button>
</div>
<!-- 顶层内容区域，预设了平移类 .swiped -->
<div class="swipe-content swiped h-full p-md flex flex-col justify-center gap-1 active:scale-[0.98] transition-transform cursor-pointer">
<p class="text-[16px] text-[#E8EAF0] font-medium truncate">帮我规划去天安门的路线</p>
<span class="text-[12px] text-[#8A8F9C]">昨天 20:15</span>
</div>
</div>
<!-- 会话 3：常规状态 -->
<div class="w-full bg-[#1A1E27] rounded-2xl p-md active:scale-[0.98] transition-transform cursor-pointer">
<div class="flex flex-col gap-1">
<p class="text-[16px] text-[#E8EAF0] font-medium truncate">附近的咖啡馆推荐</p>
<span class="text-[12px] text-[#8A8F9C]">8月12日 09:40</span>
</div>
</div>
<!-- 会话 4：常规状态 -->
<div class="w-full bg-[#1A1E27] rounded-2xl p-md active:scale-[0.98] transition-transform cursor-pointer">
<div class="flex flex-col gap-1">
<p class="text-[16px] text-[#E8EAF0] font-medium truncate">明天早上 8 点提醒我开会</p>
<span class="text-[12px] text-[#8A8F9C]">8月10日 18:05</span>
</div>
</div>
</main>
<!-- 4. 底部 TabBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center bg-[#141821] border-t border-[#8A8F9C] border-opacity-10 h-[90px] pb-[34px] pt-xs z-50">
<!-- 左侧 Tab：对话 (未选中) -->
<button class="flex flex-col items-center justify-center gap-[2px] w-[60px] text-[#8A8F9C] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 24px;">chat_bubble_outline</span>
<span class="text-[12px]">对话</span>
</button>
<!-- 右侧 Tab：历史 (选中态) -->
<button class="flex flex-col items-center justify-center gap-[2px] w-[60px] text-[#5B8DEF] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0; font-size: 24px;">history</span>
<span class="text-[12px] font-medium">历史</span>
</button>
</nav>
<script>
        // 简易的左滑交互逻辑模拟
        document.addEventListener('DOMContentLoaded', () => {
            const swipeContents = document.querySelectorAll('.swipe-content:not(.swiped)');
            
            swipeContents.forEach(content => {
                let startX = 0;
                
                content.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                }, {passive: true});

                content.addEventListener('touchend', (e) => {
                    const endX = e.changedTouches[0].clientX;
                    const diffX = startX - endX;
                    
                    // 如果向左滑动超过 30px
                    if (diffX > 30) {
                        // 先重置所有卡片
                        document.querySelectorAll('.swipe-content.swiped').forEach(el => el.classList.remove('swiped'));
                        // 给当前卡片加上滑动状态
                        content.classList.add('swiped');
                    } else if (diffX < -30) {
                         // 向右滑恢复
                        content.classList.remove('swiped');
                    }
                }, {passive: true});
            });

            // 点击其他区域收起左滑状态
            document.addEventListener('click', (e) => {
                if(!e.target.closest('.swipe-item-container')) {
                     document.querySelectorAll('.swipe-content.swiped').forEach(el => el.classList.remove('swiped'));
                }
            });
        });
    </script>
</body></html>
