<!DOCTYPE html><html class="dark" lang="zh-CN"><head>

<title>知行AI语音导航</title>

<style>
        body {
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F1115;
            color: #E8EAF0;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(26, 30, 39, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Custom scrollbar for message flow */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(138, 143, 156, 0.3);
            border-radius: 4px;
        }
        
        /* Mic pulsing animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .mic-pulse::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(91, 141, 239, 0.4);
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* Typing animation */
        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-4px); opacity: 1; }
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
            border-radius: 50%;
            width: 6px;
            height: 6px;
            background-color: #8A8F9C;
            display: inline-block;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden max-w-[430px] mx-auto relative">
<!-- Status Bar Simulation (Optional for preview context, usually handled by OS) -->
<div class="w-full h-[44px] flex justify-between items-center px-6 text-on-surface text-[14px] font-medium z-50 shrink-0">
<span>9:41</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px] icon-filled">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px] icon-filled">wifi</span>
<span class="material-symbols-outlined text-[16px] icon-filled">battery_full</span>
</div>
</div>
<!-- TopAppBar from JSON -->
<header class="flex items-center justify-between px-container-margin h-14 w-full bg-background dark:bg-background z-40 shrink-0">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity duration-200 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline-main text-headline-main text-primary dark:text-primary">知行AI</h1>
<span class="font-caption-xs text-caption-xs text-on-surface-variant">AI 语音导航助手</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity duration-200 rounded-full">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</header>
<!-- Message Flow Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin pb-[140px] pt-4 flex flex-col space-y-6 relative">
<!-- Welcome Message (AI) -->
<div class="flex items-start gap-3 w-full max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-on-primary text-[18px]">graphic_eq</span>
</div>
<div class="flex flex-col gap-2">
<div class="bg-surface rounded-2xl rounded-tl-sm p-4 text-on-surface font-body-md text-body-md shadow-sm border border-white/5">
                    你好，我是知行。按住下方按钮说话，或直接输入文字，我可以帮你查天气、找地点、规划路线。
                </div>
<div class="flex items-center gap-3 px-1">
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">content_copy</span>
<span>复制</span>
</button>
<div class="w-[1px] h-3 bg-surface-variant"></div>
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">refresh</span>
<span>重新生成</span>
</button>
<div class="w-[1px] h-3 bg-surface-variant"></div>
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">play_arrow</span>
<span>播放语音</span>
</button>
</div>
</div>
</div>
<!-- User Message -->
<div class="flex items-start justify-end gap-3 w-full self-end mt-4">
<div class="flex flex-col gap-2 items-end max-w-[80%]">
<div class="bg-gradient-to-br from-primary to-secondary rounded-2xl rounded-tr-sm p-4 text-white font-body-md text-body-md shadow-md">
                    今天北京天气怎么样？
                </div>
</div>
</div>
<!-- AI Thinking State -->
<div class="flex items-start gap-3 w-full max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-on-primary text-[18px]">graphic_eq</span>
</div>
<div class="flex flex-col gap-2">
<div class="bg-surface rounded-2xl rounded-tl-sm p-4 text-on-surface font-body-md text-body-md shadow-sm border border-white/5 flex items-center gap-3">
<div class="flex gap-1">
<span class="typing-dot"></span>
<span class="typing-dot"></span>
<span class="typing-dot"></span>
</div>
<span class="text-on-surface-variant text-sm">正在思考...</span>
</div>
</div>
</div>
<!-- AI Response -->
<div class="flex items-start gap-3 w-full max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-on-primary text-[18px]">graphic_eq</span>
</div>
<div class="flex flex-col gap-2">
<div class="bg-surface rounded-2xl rounded-tl-sm p-4 text-on-surface font-body-md text-body-md shadow-sm border border-white/5">
                    北京今天晴，气温 22~31℃，东南风 2 级，空气质量优，适合出行。
                </div>
<div class="flex items-center gap-3 px-1">
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">content_copy</span>
</button>
<div class="w-[1px] h-3 bg-surface-variant"></div>
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">refresh</span>
</button>
<div class="w-[1px] h-3 bg-surface-variant"></div>
<button class="flex items-center gap-1 text-on-surface-variant font-caption-xs text-caption-xs hover:text-primary transition-colors text-primary">
<span class="material-symbols-outlined text-[14px] icon-filled">pause_circle</span>
<span>正在播放...</span>
</button>
</div>
</div>
</div>
<!-- Bottom spacing for scroll -->
<div class="h-8"></div>
</main>
<!-- BottomNavBar Context (Input Area) -->
<!-- Note: Adapting BottomNavBar from JSON for the specific "voice input" requirement of this page while honoring style_ keys where applicable -->
<div class="fixed bottom-0 w-full pb-stack-lg max-w-[430px] z-50 bg-gradient-to-t from-background via-background to-transparent flex justify-around items-center px-container-margin h-[120px]">
<!-- Keyboard Icon (Left) -->
<button class="flex items-center justify-center w-12 h-12 text-on-surface-variant hover:scale-105 transition-transform duration-200 bg-surface rounded-full border border-white/5 shadow-sm">
<span class="material-symbols-outlined text-[24px]">keyboard</span>
</button>
<!-- Main Voice Trigger (Center) -->
<div class="relative flex items-center justify-center h-20 w-20">
<!-- Glow Effect Wrapper -->
<div class="absolute inset-0 rounded-full shadow-[0_0_20px_rgba(93,142,241,0.5)] opacity-80 blur-md pointer-events-none"></div>
<button class="relative flex items-center justify-center w-[64px] h-[64px] rounded-full bg-surface border border-white/10 text-on-surface z-10 active:scale-95 transition-transform duration-200 mic-pulse group">
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-[32px] text-primary">mic</span>
</button>
</div>
<!-- History Icon (Right) -->
<button class="flex items-center justify-center w-12 h-12 text-on-surface-variant hover:scale-105 transition-transform duration-200 bg-surface rounded-full border border-white/5 shadow-sm active:scale-95">
<span class="material-symbols-outlined text-[24px]">history</span>
</button>
</div>
</body></html>
