<!DOCTYPE html><html class="dark" lang="zh"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>知行AI语音导航 - 聊天流</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-container": "#00275e",
                        "secondary-container": "#4e24c0",
                        "on-surface-variant": "#c3c6d4",
                        "on-tertiary-fixed": "#002116",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#003122",
                        "inverse-primary": "#1e5bba",
                        "surface-variant": "#333539",
                        "secondary-fixed": "#e7deff",
                        "outline-variant": "#424752",
                        "on-primary": "#002e6b",
                        "primary": "#aec6ff",
                        "on-secondary-fixed": "#1e0060",
                        "on-error": "#690005",
                        "outline": "#8d909e",
                        "error-container": "#93000a",
                        "tertiary-container": "#00a47b",
                        "primary-fixed-dim": "#aec6ff",
                        "on-surface": "#e2e2e8",
                        "inverse-surface": "#e2e2e8",
                        "secondary": "#ccbeff",
                        "background": "#111317",
                        "secondary-fixed-dim": "#ccbeff",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#29e0ab",
                        "on-secondary-fixed-variant": "#4c20bd",
                        "on-secondary-container": "#beadff",
                        "inverse-on-surface": "#2f3035",
                        "on-secondary": "#340098",
                        "surface-container-highest": "#333539",
                        "on-primary-fixed-variant": "#004397",
                        "surface-dim": "#111317",
                        "on-background": "#e2e2e8",
                        "surface-container-lowest": "#0c0e12",
                        "on-tertiary": "#003828",
                        "surface-tint": "#aec6ff",
                        "tertiary-fixed": "#55fdc6",
                        "surface-container-low": "#1a1c20",
                        "surface": "#111317",
                        "surface-bright": "#37393e",
                        "surface-container": "#1e2024",
                        "on-primary-fixed": "#001a43",
                        "on-tertiary-fixed-variant": "#00513b",
                        "primary-container": "#5d8ef1",
                        "primary-fixed": "#d8e2ff",
                        "tertiary": "#29e0ab",
                        "surface-container-high": "#282a2e",
                        
                        // Custom palette based on prompt
                        "app-bg": "#0F1115",
                        "app-card": "#1A1E27",
                        "app-blue": "#5B8DEF",
                        "app-purple": "#7C5BEF",
                        "app-code": "#0B0E14",
                        "app-map": "#10141C"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "12px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "container-margin": "20px",
                        "stack-sm": "8px"
                    },
                    fontFamily: {
                        "label-sm": ["Hanken Grotesk"],
                        "headline-main": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "caption-xs": ["Hanken Grotesk"],
                        "display-navigation": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "label-sm": ["17.3px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-main": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-md": ["18.6px", { lineHeight: "28px", fontWeight: "400" }],
                        "body-lg": ["21.3px", { lineHeight: "32px", fontWeight: "400" }],
                        "caption-xs": ["16px", { lineHeight: "20px", fontWeight: "400" }],
                        "display-navigation": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "sub-13": ["13px", { lineHeight: "18px", fontWeight: "400" }],
                        "sub-12": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "text-16": ["16px", { lineHeight: "24px", fontWeight: "500" }]
                    },
                    keyframes: {
                        pulseDot: {
                            '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                            '50%': { opacity: .5, transform: 'scale(0.8)' },
                        }
                    },
                    animation: {
                        'pulse-dot': 'pulseDot 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-app-bg text-on-surface h-screen flex flex-col overflow-hidden">
<!-- Top Navigation -->
<header class="flex justify-between items-center h-14 w-full px-container-margin bg-background border-b border-surface-variant/20 sticky top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container text-[24px]">menu</span>
<div class="flex flex-col">
<h1 class="font-headline-main text-headline-main text-on-surface leading-tight tracking-tight">知行AI语音导航</h1>
<span class="text-sub-13 text-on-surface-variant">AI 语音导航助手</span>
</div>
</div>
<!-- Right side empty capsule -->
<div class="w-[87px] h-[32px] rounded-full border border-surface-variant/30 bg-surface-container-low/50"></div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6 pb-24 scroll-smooth">
<!-- Message 1: User -->
<div class="flex justify-end w-full">
<div class="bg-gradient-to-r from-app-blue to-app-purple text-white rounded-2xl rounded-tr-sm px-5 py-4 max-w-[85%] shadow-sm">
<p class="font-body-md text-body-md leading-relaxed">附近 1 公里内有什么咖啡馆？</p>
</div>
</div>
<!-- Message 2: Tool Call -->
<div class="flex justify-start w-full">
<div class="bg-app-card rounded-2xl p-4 max-w-[90%] md:max-w-[70%] border border-white/5 flex flex-col gap-3">
<!-- Header -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-app-blue text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-body-md text-[16px] text-white">附近搜索</span>
</div>
<span class="text-sub-12 text-on-surface-variant animate-pulse">调用中…</span>
</div>
<!-- Code Block -->
<div class="bg-app-code rounded-lg p-3 font-mono text-sm text-gray-300 relative border border-white/5 overflow-x-auto">
<div class="absolute top-3 right-3 w-2 h-2 bg-app-blue rounded-full animate-pulse-dot shadow-[0_0_8px_rgba(91,141,239,0.8)]"></div>
<div><span class="text-pink-400">"keyword"</span>: <span class="text-green-300">"咖啡"</span>,</div>
<div><span class="text-pink-400">"radius"</span>: <span class="text-orange-300">1000</span></div>
</div>
<!-- Footer -->
<div class="text-sub-13 text-on-surface-variant flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] animate-spin">sync</span>
                    正在调用 maps_search_around…
                </div>
</div>
</div>
<!-- Message 3: Map Result -->
<div class="flex justify-start w-full">
<div class="bg-app-card rounded-2xl overflow-hidden max-w-[90%] md:max-w-[70%] border border-white/5 flex flex-col">
<!-- Map Area -->
<div class="h-[200px] bg-app-map relative w-full overflow-hidden" data-alt="A highly detailed, stylized dark-mode map interface of an urban area. The base color is a deep, rich black (#10141C) with subtle, intersecting dark gray lines representing city streets and blocks. The lighting is completely flat, fitting a functional UI aesthetic. No real-world photography, just an abstract, minimalist vector-style map layout optimized for a digital interface." data-location="Shanghai" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAaZw3b2ZypZBj2CZXHDd8bdhlPOTRE5pdht0MKuE8Njb2oZKvwANy2sFKRO52vl_EjdNw5IuJV0F19xHrdQja1yjxUUZKbQGWvtLX177LVcHjSccqFULFDvnBIMwvZXahW3RBUoyRwlfROcpmwFGC-u722hUoBVb57jAwVDk8a8ukduV0dYTRg7yKOu6Lh68vBzAGjfbhuX2evvfKDibRi-hC6_nRKa7FMVTgsF_YuT_1MDPsqbQtI')">
<!-- Simulated Map Elements (if background fails or just as overlay) -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #333539 25%, transparent 25%, transparent 75%, #333539 75%, #333539), repeating-linear-gradient(45deg, #333539 25%, #10141C 25%, #10141C 75%, #333539 75%, #333539); background-position: 0 0, 10px 10px; background-size: 20px 20px;"></div>
<!-- Center Location Drop -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-8 h-8 bg-app-blue/20 rounded-full flex items-center justify-center animate-pulse">
<div class="w-4 h-4 bg-app-blue rounded-full border-2 border-app-map shadow-[0_0_10px_rgba(91,141,239,0.5)]"></div>
</div>
</div>
<!-- POI Markers -->
<div class="absolute top-[30%] left-[60%] flex flex-col items-center group cursor-pointer">
<div class="bg-[#FF4A4A] text-white text-[10px] px-2 py-0.5 rounded-full mb-1 font-bold shadow-lg whitespace-nowrap">星巴克</div>
<span class="material-symbols-outlined text-[#FF4A4A] text-[24px] drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="absolute top-[70%] left-[20%] flex flex-col items-center group cursor-pointer">
<div class="bg-[#FF4A4A] text-white text-[10px] px-2 py-0.5 rounded-full mb-1 font-bold shadow-lg whitespace-nowrap">瑞幸</div>
<span class="material-symbols-outlined text-[#FF4A4A] text-[24px] drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- Zoom Controls -->
<div class="absolute right-3 bottom-3 flex flex-col bg-app-card/80 backdrop-blur-md rounded-lg border border-white/10 overflow-hidden">
<button class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-variant/50 transition-colors border-b border-white/10">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<button class="w-8 h-8 flex items-center justify-center text-on-surface hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
</div>
</div>
<!-- Card Lower Info -->
<div class="p-4 flex items-center justify-between bg-app-card">
<div class="flex flex-col">
<span class="text-text-16 text-white font-medium">找到 5 个结果</span>
<span class="text-sub-13 text-on-surface-variant">距您最近 320 米</span>
</div>
<button class="text-app-blue text-sub-13 font-medium hover:opacity-80 transition-opacity flex items-center gap-1 bg-app-blue/10 px-3 py-1.5 rounded-full">
                        查看全部
                        <span class="material-symbols-outlined text-[14px]">chevron_right</span>
</button>
</div>
</div>
</div>
<!-- Message 4: AI Message -->
<div class="flex justify-start w-full">
<div class="bg-app-card text-on-surface rounded-2xl rounded-tl-sm px-5 py-4 max-w-[85%] border border-white/5 shadow-sm">
<p class="font-body-md text-body-md leading-relaxed">为您找到 5 家咖啡馆，最近的是星巴克（约 320 米），已在地图中标注。</p>
</div>
</div>
</main>
<!-- Bottom Input Area (Implied by context, keeping minimalist) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-app-bg via-app-bg to-transparent pb-safe">
<div class="flex justify-center items-center">
<!-- Voice Trigger Button -->
<button class="w-[64px] h-[64px] bg-app-blue rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(91,141,239,0.3)] hover:scale-105 active:scale-95 transition-transform group">
<span class="material-symbols-outlined text-white text-[32px] group-hover:animate-pulse" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
</body></html>
